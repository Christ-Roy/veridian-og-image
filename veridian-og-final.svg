<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond -->
  <rect width="1200" height="630" fill="#e6f2f2" />
  
  <!-- En-tête -->
  <g transform="translate(40, 40)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#2c6161">Veridian</text>
    
    <g transform="translate(800, 0)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="18" fill="#4a4a4a">Accueil</text>
      <text x="100" y="0" font-family="Arial, sans-serif" font-size="18" fill="#4a4a4a">Pour qui</text>
      <text x="200" y="0" font-family="Arial, sans-serif" font-size="18" fill="#4a4a4a">Notre approche</text>
    </g>
  </g>
  
  <!-- Contenu principal -->
  <g transform="translate(40, 200)">
    <!-- Titre principal -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#2c6161">Votre site</text>
    <text x="0" y="80" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#2c6161">commence ici,</text>
    <text x="0" y="160" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#ff6e14">gratuitement.</text>
    
    <!-- Sous-titre -->
    <text x="0" y="220" font-family="Arial, sans-serif" font-size="24" fill="#4a4a4a">Transformez les visiteurs en ligne en clients réels</text>
    <text x="0" y="255" font-family="Arial, sans-serif" font-size="24" fill="#4a4a4a">pour votre commerce</text>
    
    <!-- Bouton -->
    <rect x="0" y="290" width="340" height="60" rx="8" fill="#ff6e14" />
    <text x="170" y="330" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle">Obtenir mon ébauche gratuite</text>
  </g>
  
  <!-- Illustration -->
  <g transform="translate(700, 200)">
    <rect x="0" y="0" width="440" height="350" rx="12" fill="#2c6161" />
    
    <!-- Cercles d'illustration -->
    <circle cx="120" cy="100" r="60" fill="#ff9966" />
    <circle cx="280" cy="120" r="70" fill="#66cccc" />
    <circle cx="220" cy="260" r="80" fill="#4a8080" />
    
    <!-- Icônes stylisées -->
    <g transform="translate(120, 100)">
      <rect x="-25" y="-25" width="50" height="50" rx="25" fill="#ff9966" />
      <rect x="-15" y="-10" width="30" height="20" rx="5" fill="#2c6161" />
    </g>
    
    <g transform="translate(280, 120)">
      <circle cx="0" cy="0" r="35" fill="#66cccc" />
      <path d="M-15,-15 L15,15 M-15,15 L15,-15" stroke="#2c6161" stroke-width="5" />
    </g>
    
    <g transform="translate(220, 260)">
      <circle cx="0" cy="0" r="40" fill="#4a8080" />
      <circle cx="0" cy="0" r="20" fill="#2c6161" />
    </g>
  </g>
</svg>